		<script>
		(function () {
			var btn = document.getElementById('theme-toggle');
			function current() {
				var attr = document.documentElement.getAttribute('data-theme');
				if (attr) return attr;
				return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			function refresh() {
				btn.innerHTML = current() === 'dark' ? '&#9728;' : '&#9789;';
			}
			btn.addEventListener('click', function () {
				var next = current() === 'dark' ? 'light' : 'dark';
				document.documentElement.setAttribute('data-theme', next);
				try { localStorage.setItem('theme', next); } catch (e) {}
				refresh();
			});
			refresh();
		})();
		</script>

		<script>
		(function () {
			var N = 7;
			var numbers = [];
			var selected = [];
			var solution = [];
			var target = 0;
			var solved = false;

			function randInt(min, max) {
				return Math.floor(Math.random() * (max - min + 1)) + min;
			}

			function newPuzzle() {
				numbers = [];
				for (var i = 0; i < N; i++) numbers.push(randInt(1, 30));

				var subsetSize = randInt(2, N - 1);
				var indices = numbers.map(function (_, i) { return i; });
				indices.sort(function () { return Math.random() - 0.5; });
				var chosen = indices.slice(0, subsetSize);
				target = chosen.reduce(function (sum, i) { return sum + numbers[i]; }, 0);
				solution = chosen;

				selected = [];
				solved = false;
				render();
			}

			function render() {
				document.getElementById('ss-target-value').textContent = target;

				var sum = selected.reduce(function (s, i) { return s + numbers[i]; }, 0);
				if (sum === target && selected.length > 0) solved = true;

				var chipsEl = document.getElementById('ss-chips');
				chipsEl.innerHTML = '';
				numbers.forEach(function (n, i) {
					var chip = document.createElement('button');
					chip.className = 'ss-chip' + (selected.indexOf(i) > -1 ? ' selected' : '');
					chip.textContent = n;
					chip.disabled = solved;
					chip.setAttribute('aria-pressed', selected.indexOf(i) > -1);
					chip.addEventListener('click', function () {
						if (solved) return;
						var idx = selected.indexOf(i);
						if (idx > -1) selected.splice(idx, 1);
						else selected.push(i);
						render();
					});
					chipsEl.appendChild(chip);
				});

				var sumEl = document.getElementById('ss-sum');
				sumEl.textContent = solved ? 'Solved!' : 'selected sum: ' + sum;
				sumEl.className = 'ss-sum' + (solved ? ' match' : '');
			}

			document.getElementById('ss-shuffle').addEventListener('click', newPuzzle);
			document.getElementById('ss-giveup').addEventListener('click', function () {
				if (solved) return;
				selected = solution.slice();
				render();
			});

			newPuzzle();
		})();
		</script>
